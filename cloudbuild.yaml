# =============================================================================
# cloudbuild.yaml — PR validation pipeline
#
# Trigger: Cloud Build GitHub App trigger, event = "Pull request", target
#          branch = main (see docs/SETUP_GUIDE.md, section 3).
#
# Flow:
#   1. Make gradlew executable.
#   2. Run unit tests, JaCoCo coverage and an assembleDebug build in one
#      shot, capturing full output to build_log.txt. The step never fails on
#      its own (set +e) — the real Gradle exit code is written to a file so
#      later steps can react to it without Cloud Build aborting the build
#      early (which would skip the PR comment step).
#   3. If the Gradle run failed, fetch the `github-pr-token` secret from
#      Secret Manager, resolve the open PR for the current commit, and post
#      the tail of the build log as a PR comment.
#   4. Re-exit with the real Gradle exit code so Cloud Build (and therefore
#      the GitHub status check / branch protection) correctly reports
#      success or failure.
# =============================================================================

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/github-pr-token/versions/latest
      env: 'GITHUB_TOKEN'

steps:
  # Restore the Gradle cache before anything else. Best-effort: a cache miss
  # is a cold build, never a failure.
  - id: 'restore-gradle-cache'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        mkdir -p /workspace/.gradle
        if gcloud storage cp "gs://$PROJECT_ID-cloudbuild-artifacts/gradle-cache/gradle-cache.tar" /workspace/gradle-cache.tar 2>/dev/null; then
          tar -xf /workspace/gradle-cache.tar -C /workspace/.gradle
          rm -f /workspace/gradle-cache.tar
          echo "Gradle cache restored."
          du -sh /workspace/.gradle 2>/dev/null || true
        else
          echo "No Gradle cache found — this build will be cold."
        fi

  - id: 'prepare-gradlew'
    name: 'gcr.io/cloud-builders/git'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'chmod +x gradlew'

  - id: 'test-coverage-build'
    # Self-built image (see .cloudbuild/builder/Dockerfile): JDK 17 + Android
    # SDK 34. Google publishes no official Android builder image, and it lives
    # in the same region as the build so the pull is fast.
    name: 'us-central1-docker.pkg.dev/$PROJECT_ID/android-builders/android-sdk:34'
    entrypoint: 'bash'
    # GRADLE_USER_HOME must sit under /workspace: only that path is shared
    # between build steps, so the cache restored above would otherwise be
    # invisible here.
    env:
      - 'GRADLE_USER_HOME=/workspace/.gradle'
    args:
      - '-c'
      - |
        set +e
        ./gradlew test jacocoTestReport assembleDebug > build_log.txt 2>&1
        echo $$? > /workspace/build_exit_code.txt
        echo "----- build_log.txt (tail) -----"
        tail -n 100 build_log.txt
        exit 0

  - id: 'notify-github-on-failure'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'bash'
    secretEnv: ['GITHUB_TOKEN']
    args:
      - '-c'
      - |
        set -e
        EXIT_CODE=$$(cat /workspace/build_exit_code.txt)

        if [ "$$EXIT_CODE" = "0" ]; then
          echo "Build succeeded — no failure comment needed."
          exit 0
        fi

        echo "Build failed with exit code $$EXIT_CODE — posting comment to the PR."

        python3 - <<'PYEOF'
        import json
        import os
        import sys
        import urllib.request
        import urllib.error

        owner = "${_GITHUB_OWNER}"
        repo = "${_GITHUB_REPO}"
        commit_sha = "${COMMIT_SHA}"
        short_sha = "${SHORT_SHA}"
        build_id = "${BUILD_ID}"
        project_id = "${PROJECT_ID}"
        token = os.environ["GITHUB_TOKEN"]

        headers = {
            "Authorization": f"token {token}",
            "Accept": "application/vnd.github+json",
            "User-Agent": "cloud-build-pr-validator",
        }

        def api_request(url, data=None, method="GET"):
            req = urllib.request.Request(url, data=data, headers=headers, method=method)
            with urllib.request.urlopen(req) as resp:
                return json.loads(resp.read() or b"{}")

        # Resolve the open PR associated with this commit — avoids depending
        # on trigger-specific substitutions that vary between GitHub App
        # trigger versions.
        try:
            pulls = api_request(
                f"https://api.github.com/repos/{owner}/{repo}/commits/{commit_sha}/pulls"
            )
        except urllib.error.HTTPError as e:
            print(f"Failed to look up PR for commit {commit_sha}: {e}", file=sys.stderr)
            sys.exit(0)

        if not pulls:
            print(f"No open pull request found for commit {commit_sha}. Skipping comment.")
            sys.exit(0)

        pr_number = pulls[0]["number"]

        with open("/workspace/build_log.txt") as f:
            log_tail = "".join(f.readlines()[-60:])

        build_console_url = (
            f"https://console.cloud.google.com/cloud-build/builds/{build_id}?project={project_id}"
        )

        body = (
            "### Cloud Build PR validation failed\n\n"
            f"**Commit:** `{short_sha}`\n"
            f"**Build ID:** `{build_id}`\n\n"
            "<details><summary>Last 60 lines of build log</summary>\n\n"
            "```\n" + log_tail + "\n```\n\n"
            "</details>\n\n"
            f"[View full build log]({build_console_url})"
        )

        try:
            result = api_request(
                f"https://api.github.com/repos/{owner}/{repo}/issues/{pr_number}/comments",
                data=json.dumps({"body": body}).encode(),
                method="POST",
            )
            print(f"Posted failure comment to PR #{pr_number}: id={result.get('id')}")
        except urllib.error.HTTPError as e:
            print(f"Failed to post PR comment: {e}", file=sys.stderr)
            sys.exit(0)
        PYEOF

  # Runs before enforce-build-status deliberately: a failing build should still
  # warm the cache, otherwise a run of red builds keeps paying the cold-start
  # download cost.
  - id: 'save-gradle-cache'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        cd /workspace/.gradle 2>/dev/null || { echo "No GRADLE_USER_HOME to cache."; exit 0; }

        CACHE_PATHS=""
        [ -d wrapper/dists ] && CACHE_PATHS="$$CACHE_PATHS wrapper/dists"
        [ -d caches/modules-2 ] && CACHE_PATHS="$$CACHE_PATHS caches/modules-2"

        if [ -z "$$CACHE_PATHS" ]; then
          echo "Nothing worth caching yet."
          exit 0
        fi

        # Uncompressed on purpose: the cache is almost entirely jars, which are
        # already deflated, so gzip would burn CPU on a 2-vCPU worker for a
        # negligible size win.
        tar -cf /workspace/gradle-cache.tar $$CACHE_PATHS
        ls -lh /workspace/gradle-cache.tar
        gcloud storage cp /workspace/gradle-cache.tar "gs://$PROJECT_ID-cloudbuild-artifacts/gradle-cache/gradle-cache.tar"
        echo "Gradle cache saved."

  - id: 'enforce-build-status'
    name: 'gcr.io/cloud-builders/git'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        EXIT_CODE=$$(cat /workspace/build_exit_code.txt)
        if [ "$$EXIT_CODE" != "0" ]; then
          echo "Failing the Cloud Build run so the GitHub status check reports failure."
        fi
        exit $$EXIT_CODE

artifacts:
  objects:
    location: 'gs://$PROJECT_ID-cloudbuild-artifacts/pr-checks/$BUILD_ID/'
    paths:
      - 'app/build/outputs/apk/debug/*.apk'
      - 'app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml'

options:
  # E2_MEDIUM is the machine type covered by Cloud Build's always-free tier
  # (120 build-minutes/day). Cloud Build's options.machineType enum does not
  # include "E2_STANDARD_2" — see docs/ARCHITECTURE.md for the full note.
  machineType: 'E2_MEDIUM'
  logging: CLOUD_LOGGING_ONLY

substitutions:
  # Override these in the trigger configuration (Settings > Substitution
  # variables) rather than editing this file per-environment.
  _GITHUB_OWNER: 'your-github-username'
  _GITHUB_REPO: 'mini-android-app'

timeout: '1200s'
